<style>
:root{
  --night:#0b0d20; --deep:#12152f; --panel:#1b1e46; --panel2:#282d63; --edge:#f4f1e8;
  --gold:#f6c445; --gold2:#b9861c; --maroon:#8c2338; --pink:#ff6fae; --mint:#7be3a3;
  --sky:#6fc8ff; --text:#f4f1e8; --dim:#a7a9cc; --shadow:rgba(0,0,0,.5);
  --body:"Pixelify Sans",ui-monospace,"SF Mono",Menlo,monospace;
  --display:"Jacquard 24","Pixelify Sans",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night);overscroll-behavior:none;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  min-height:100%;margin:0;display:flex;justify-content:center;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:
    radial-gradient(1100px 520px at 50% -10%,#232a5e 0%,transparent 60%),
    radial-gradient(700px 400px at 90% 110%,#3a1634 0%,transparent 65%),
    var(--night);
  color:var(--text);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overflow-x:hidden;overscroll-behavior:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{width:100%;max-width:880px;display:flex;flex-direction:column;gap:9px}
.win{background:var(--panel);border:3px solid var(--edge);border-radius:8px;box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 4px var(--panel2),3px 3px 0 var(--shadow)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:15px;flex-wrap:wrap}
.hud-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.hud-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.lvl{color:var(--gold);font-weight:700;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.hearts{letter-spacing:1px;font-size:17px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.hearts .hp{color:#ff5d7a}
.hearts .hp.off{color:#3d4170}
.stat{font-variant-numeric:tabular-nums;background:#11132b;border:2px solid var(--panel2);border-radius:5px;padding:2px 7px;font-size:14px;white-space:nowrap}
.stat b{color:var(--gold);font-weight:700}
.candle-ico{display:inline-block;position:relative;width:7px;height:11px;margin-right:4px;vertical-align:-1px;background:linear-gradient(#fffdf4,#eadfc6);border-radius:1px;box-shadow:inset -2px 0 0 #cfc2a6,0 0 0 1px rgba(0,0,0,.25)}
.candle-ico::after{content:"";position:absolute;left:0;bottom:2px;width:100%;height:2px;background:#e8364b;opacity:.85}
.candle-ico::before{content:"";position:absolute;left:1px;top:-6px;width:5px;height:6px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 78%,#fffbe0 0%,#ffd35a 42%,#ff8a3d 68%,rgba(255,138,61,0) 72%)}
.stage.bossmode .toast{top:52px}
.iconbtn{width:34px;height:30px;display:grid;place-items:center;background:#11132b;border:2px solid var(--panel2);border-radius:5px;cursor:pointer;font-size:14px;padding:0}
.iconbtn:hover{background:var(--panel2)}
.iconbtn[aria-pressed="false"]{color:var(--dim)}
.iconbtn:focus-visible,.btn:focus-visible,.pad button:focus-visible,.lvbtn:focus-visible,.hatbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:432/240;border:3px solid var(--edge);border-radius:8px;overflow:hidden;background:#0a0b18;box-shadow:0 0 0 3px #06070f,0 10px 30px rgba(0,0,0,.45)}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.stage:fullscreen{aspect-ratio:auto;border:0;border-radius:0;background:#000;display:grid;place-items:center}
.stage:fullscreen canvas{width:100%;height:100%;object-fit:contain}
@supports not (aspect-ratio: 1 / 1){
  .stage{height:0;padding-top:55.56%}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%}
}
.bossbar{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:min(78%,420px);padding:4px 8px 6px;background:rgba(11,13,32,.82);border:2px solid var(--edge);border-radius:6px;pointer-events:none}
.bname{display:block;font-size:11px;letter-spacing:.12em;color:var(--gold);text-align:center;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:2px;justify-content:center}
.pip{height:8px;flex:1;max-width:34px;background:#3a3d6a;border:1px solid #0b0d20;border-radius:2px;overflow:hidden;position:relative}
.pip i{position:absolute;inset:0;background:linear-gradient(#ff7b6b,#c0392b);transform-origin:left;transition:transform .18s steps(3)}
.pip.dead i{transform:scaleX(0)}
.combo{position:absolute;right:10px;top:64px;display:grid;justify-items:center;color:var(--gold);text-shadow:2px 2px 0 var(--maroon);pointer-events:none;transform-origin:50% 50%}
.combo span{font-family:var(--display);font-size:34px;line-height:.8}
.combo small{font-size:9px;letter-spacing:.18em;color:var(--edge)}
.combo.pop{animation:cpop .22s ease-out}
@keyframes cpop{0%{transform:scale(1.6) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:94%;padding:5px 11px;background:rgba(17,19,43,.94);border:2px solid var(--edge);border-radius:5px;font-size:clamp(12px,2.6vw,16px);text-align:center;pointer-events:none;line-height:1.25}
.toast b{color:var(--gold)}
.dialog{position:absolute;left:7px;right:7px;bottom:7px;display:flex;align-items:center;gap:9px;padding:8px 30px 8px 8px;font-size:clamp(13px,3.1vw,18px);line-height:1.3;cursor:pointer;background:rgba(27,30,70,.97);min-height:52px}
.dialog p{margin:0}
.dialog b{color:var(--gold)}
.dialog .portrait{width:40px;height:44px;image-rendering:pixelated;object-fit:contain;flex:none;background:#11132b;border:2px solid var(--panel2);border-radius:4px;padding:2px}
.dialog .next{position:absolute;right:9px;bottom:5px;color:var(--gold);animation:bob .8s steps(2) infinite;font-size:12px}
@keyframes bob{50%{transform:translateY(3px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
.flash.on{animation:fl .16s ease-out}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
[hidden]{display:none!important}
.pad{display:grid;grid-template-columns:1fr 1.15fr;gap:9px;touch-action:none;paint-order:stroke fill}
.dpad,.acts{display:grid;gap:9px}
.dpad{grid-template-columns:1fr 1fr}
.acts{grid-template-columns:1fr 1.25fr}
.pad button{min-height:78px;padding:0;font-size:26px;font-weight:700;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.pad button.jump{background:var(--gold);color:var(--night);font-size:21px}
.pad button.pow{background:var(--pink);color:var(--night);font-size:18px}
.pad button.pow:disabled{background:var(--panel);color:var(--dim);opacity:.6;box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 4px #22264f}
.pad button.held{transform:translate(2px,3px);filter:brightness(.88);box-shadow:inset 0 0 0 2px var(--panel),1px 1px 0 var(--shadow)}
.keys{margin:0;text-align:center;font-size:13px;color:var(--dim)}
@media (hover:hover) and (pointer:fine){.pad button{min-height:56px}}

/* pause */
.pause{position:fixed;inset:0;background:rgba(8,9,22,.86);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px);z-index:60;overflow:auto}
.pausebox{width:min(340px,94%);padding:16px 18px;display:grid;gap:10px;text-align:center}
.pausebox h2{margin:0;font-family:var(--display);font-size:34px;line-height:.9;font-weight:400;color:var(--gold)}
.pausebox .tiny{margin:0;font-size:11px;color:var(--dim)}
.btncol{display:grid;gap:7px}

/* screens */
.screen{padding:18px 16px 22px;display:grid;align-content:start;gap:14px;min-height:320px}
.eyebrow{margin:0;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1.title{margin:0;font-family:var(--display);font-weight:400;line-height:.86;text-wrap:balance;letter-spacing:.01em}
h1.title .t1{display:block;font-size:clamp(50px,13.5vw,96px);color:var(--gold);text-shadow:3px 3px 0 var(--maroon)}
h1.title .t2{display:block;font-size:clamp(24px,6.4vw,40px);color:var(--edge)}
.lede{margin:0;font-size:clamp(15px,2.4vw,18px);line-height:1.45;max-width:66ch}
.lede b{color:var(--gold)}
.cast{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:6px 0 2px}
.cast figure{margin:0;display:grid;justify-items:center;gap:5px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.15}
.cast img{image-rendering:pixelated;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.cast figcaption b{color:var(--edge)}
.heroline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.heroline .pill{border:2px solid var(--panel2);background:#11132b;border-radius:99px;padding:3px 10px;color:var(--edge);font-size:12px}
.btn{min-height:48px;padding:8px 18px;background:#11132b;border:3px solid var(--edge);border-radius:6px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.go{background:var(--gold);color:var(--night);border-color:#fff7db}
.btn.ghost{background:transparent;border-color:var(--panel2);font-size:14px;min-height:40px;font-weight:600}
.btnbeat{display:inline-block;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.btnrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.howto li{background:#151838;border:2px solid var(--panel2);border-radius:6px;padding:9px 11px;font-size:14px;line-height:1.35;display:flex;gap:9px;align-items:flex-start}
.howto li .ico{font-size:18px;line-height:1.1;flex:none}
.howto b{color:var(--gold)}
/* stage map */
.mapgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:9px}
.lvbtn{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;text-align:left;cursor:pointer;background:var(--panel);border:3px solid var(--edge);border-radius:7px;box-shadow:inset 0 0 0 2px var(--panel),2px 3px 0 var(--shadow);position:relative}
.lvbtn .n{font-family:var(--display);font-size:32px;color:var(--gold);text-align:center;line-height:1}

/* ============================================================
   PLAYER
   ============================================================ */
function updatePlayer() {
  const rush = P.rush > 0;
  const left = input.left || padIn.left, right = input.right || padIn.right;
  const acc = P.onGround ? 0.44 : 0.30, max = rush ? 3.5 : 2.75;
  const wasGround = P.onGround;

  if (left && !right) {
    if (P.vx > 0 && P.onGround) { P.skid = 6; dust(P.x + 5, P.y + P.h, 2, 'rgba(244,241,232,.5)'); }
    P.vx = Math.max(-max, P.vx - acc); P.face = -1;
  } else if (right && !left) {
    if (P.vx < 0 && P.onGround) { P.skid = 6; dust(P.x + 5, P.y + P.h, 2, 'rgba(244,241,232,.5)'); }
    P.vx = Math.min(max, P.vx + acc); P.face = 1;
  } else {
    P.vx *= P.onGround ? 0.74 : 0.94;
    if (Math.abs(P.vx) < 0.08) P.vx = 0;
  }
  if (P.onGround) {
    P.coyote = 7;
    P.airJumps = pets.cats.length ? 1 : 0;
    if (Math.abs(P.vx) > 0.4) P.anim += Math.abs(P.vx) * 0.16;
  } else if (P.coyote > 0) P.coyote--;

  if (input.jumpBuf > 0) input.jumpBuf--;
  if (input.jumpBuf > 0) {
    if (P.coyote > 0) {
      P.vy = -6.75; P.coyote = 0; input.jumpBuf = 0; P.jumpT = 0;
      P.stretch = 8; SFX.jump(); dust(P.x + 5, P.y + P.h, 3);
    } else if (P.airJumps > 0 && P.vy > -2.4) {
      P.vy = -5.95; P.airJumps--; input.jumpBuf = 0; P.jumpT = 0; P.stretch = 7;
      SFX.djump(); sparks(P.x + 5, P.y + P.h - 1, 6, ['#f6c445', '#fff']);
      part(P.x + 5, P.y + P.h, { vx: 0, vy: 0.4, life: 18, size: 1, type: 'ring', color: '#f6c445' });
    }
  }
  if (P.jumpT != null) P.jumpT++;
  /* variable height, but never a useless hop: the first 8 frames are guaranteed */
  if (!(input.jump || padIn.jump) && P.vy < -3.2 && (P.jumpT == null || P.jumpT > 8)) P.vy = -3.2;
  P.vy = Math.min(7.6, P.vy + ((P.vy < 0 && (input.jump || padIn.jump)) ? 0.30 : 0.44));
  if (P.vy >= 0) P.springy = false;

  moveX(P);
  if (boss === 'fight' || boss === 'intro') {
    P.x = clamp(P.x, (L.arenaX + 1) * T, (L.arenaX + L.arenaW) * T - P.w);
  }
  const head = moveY(P);
  if (P.onGround && frame % 10 === 0) lastSafe = { x: P.x, y: P.y };
  if (P.onGround && P.landTile === 6) {
    P.vy = -10.4; P.onGround = false; P.springy = true;
    SFX.spring(); shakeIt(2);
    pop(P.x, P.y - 8, 'BOING!', 26, '#6fc8ff');
    sparks(P.x + 5, P.y + P.h, 8, ['#6fc8ff', '#fff', '#ff6fae']);
  }
  if (head && tileAt(head.tx, head.ty) === 3) hitGift(head.tx, head.ty);
  if (!wasGround && P.onGround) {
    P.landT = 7; P.squash = 6;
    if (Math.abs(P.vy) > 2) dust(P.x + 5, P.y + P.h, 4);
  }

  if (P.inv > 0) P.inv--;
  if (P.squash > 0) P.squash--;
  if (P.stretch > 0) P.stretch--;
  if (P.skid > 0) P.skid--;
  if (P.rush > 0) { P.rush--; if (P.rush === 0) updHud(); }
  if (P.fireCd > 0) P.fireCd--;
  if (input.fireBuf > 0) input.fireBuf--;
  if (input.fireBuf > 0 && P.power === 'popper' && P.fireCd === 0 && blasts.length < 4) {
    blasts.push({ x: P.x + (P.face > 0 ? P.w : -6), y: P.y + 6, w: 6, h: 6, vx: P.face * 4.4, life: 55 });
    P.fireCd = hasPet('cat4') ? 8 : 11; input.fireBuf = 0; SFX.pew();
    part(P.x + (P.face > 0 ? 12 : -2), P.y + 9, { vx: P.face * 1.2, vy: -0.4, life: 12, size: 2, color: '#ff6fae', glow: true });
  }

  if (P.y > H + 10) {
    P.hp = Math.max(0, P.hp - 1); heartsLost++;
    SFX.hurt(); shakeIt(4); flashScreen();
    if (P.hp <= 0) { P.dead = 1; P.vy = -5; return; }
    P.x = boss === 'fight' ? (L.arenaX + 2) * T : (cpHit ? spawn.x : lastSafe.x || spawn.x);
    P.y = boss === 'fight' ? (GROUND - 1) * T : (cpHit ? spawn.y : lastSafe.y || spawn.y);
    P.vx = P.vy = 0; P.inv = 100; trail = []; breakCombo();
    camX = clamp(P.x - W * 0.42, 0, Math.min(L.w * T - W, (L.arenaX + L.arenaW + 1) * T - W));
    updHud();
    if (P.hp === 1) callDad('heal');
  }
}

function hurt(from) {
  if (P.inv > 0 || P.dead || P.rush > 0 || paused) return;
  if (P.hat) {
    P.hat = false; P.inv = 90; P.vy = -3.2;
    SFX.stomp(); pop(P.x, P.y - 10, 'CLONK!', 26, '#f6c445'); updHud();

  sparks(P.x + 5, P.y + 8, 8, ['#ff6b6b', '#fff']);

}

function die() {
  if (running && !L) return;
  deaths++;
  breakCombo();

  (async () => {
    const atBoss = boss === 'fight';

    Music.duck(false);

    camX = clamp(P.x - W * 0.42, 0, Math.min(L.w * T - W, (L.arenaX + L.arenaW + 1) * T - W));
    trail = []; updHud(); setPaused(false);
  })();
}

function addCandle(n) {

  if (got >= nextHeartAt) {
    nextHeartAt += 25;
    P.max = Math.min(5, Math.max(P.max, P.hp + 1));

}
function hitGift(tx, ty) {

function updateWorld() {

      sparks(it.x + 6, it.y + 6, 14, ['#f6c445', '#ff6fae', '#fff']);

  }

  if (crate && !crate.open) {
    crate.t++;

      else pets.dogs.push({ id: def.id, def: def, x: crate.x, y: crate.y + 6, t: 0, dash: null, face: 1 });

      pop(crate.x, crate.y - 10, def.perk.toUpperCase(), 50, '#f6c445');
      sparks(crate.x + 8, crate.y + 8, 22, ['#f6c445', '#fff', '#7be3a3']);
      shakeIt(3); updHud();
    }
  }
  for (const p of pops) { p.t--; p.y -= 0.55; }
  pops = pops.filter((p) => p.t > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= p.drag; p.life--;
  }
  parts = parts.filter((p) => p.life > 0);
  for (const r of rings) { r.r += 6; r.t--; }
  rings = rings.filter((r) => r.t > 0);
  if (comboT > 0) { comboT--; if (comboT === 0) breakCombo(); }
}
/* ============================================================
   PETS · DAD · BIG BRO
   ============================================================ */
function updatePets() {
  trail.push({ x: P.x, y: P.y + P.h, face: P.face });
  if (trail.length > 60) trail.shift();
  const at = (n) => trail[Math.max(0, trail.length - n)];
  pets.cats.forEach((c, i) => {
    const p = at(12 + i * 10);
    if (!p) return;
    c.x = lerp(c.x, p.x - (18 + i * 16) * p.face, 0.22);
    c.y = p.y - 10 - (i % 2);
    c.face = p.face;
    if (Math.random() < 0.006) part(c.x + 5, c.y + 8, { vx: 0, vy: -0.2, life: 16, size: 1, color: c.def.color, glow: true });
  });
  pets.dogs.forEach((d, i) => {
    d.t++;
    if (d.dash) {
      const tgt = d.dash;
      d.x = lerp(d.x, tgt.x, 0.3);
      d.y = lerp(d.y, tgt.y + tgt.h - 12, 0.3);
      d.face = sign(tgt.x - d.x) || 1;
      if (Math.random() < 0.5) part(d.x + 5, d.y + 9, { vx: -d.face * 0.6, vy: 0, life: 12, size: 1, color: '#fff' });
      if (Math.abs(tgt.x - d.x) < 7 || !(tgt.alive || tgt.isBoss)) {
        if (tgt.isBoss) {
          if (!tgt.out) { tgt.stun = Math.max(tgt.stun, 70 + i * 20); pop(tgt.x, tgt.y - 10, 'WOOF! 💫', 40, '#ff6fae'); }
          d.t = -240;
        } else { killFoe(tgt, 'WOOF!'); d.t = 0; }
        SFX.woof(); d.dash = null;
      }
    } else {
      const p = at(34 + i * 10);
      if (p) {
        d.x = lerp(d.x, p.x - (80 + i * 20) * p.face, 0.16);
        d.y = p.y - 11;
        d.face = p.face;
      }
      const cd = (hasPet('dog2') ? 130 : 165) + i * 40;
      if (d.t > cd) {
        const taken = pets.dogs.filter((o) => o !== d && o.dash).map((o) => o.dash);
        let tgt = null;
        if (boss === 'fight') {
          const list = bosses.filter((b) => !b.out && b.stun === 0);
          tgt = list.filter((b) => taken.indexOf(b) < 0)[0] || null;
          if (tgt) tgt.isBoss = true;
        } else {
          const list = foes.filter((f) => f.alive && Math.abs(f.x - P.x) < 130 && f.x > camX - 20 && f.x < camX + W + 20 && f.def.beh !== 'flyer');
          tgt = list.filter((f) => taken.indexOf(f) < 0)[0] || null;
        }
        if (tgt) { d.dash = tgt; SFX.woof(); }
        else d.t = 110;
      }
    }
  });
}

function callDad(mode) {
  const inBoss = boss === 'fight';
  if (mode === 'heal') {
    if (inBoss ? dadUsedBoss : dadUsedStage) return;
    if (inBoss) dadUsedBoss = true; else dadUsedStage = true;
  }
  if (dad) return;
  dad = { x: Math.max(camX - 20, P.x - W * 0.5), y: (GROUND - 2) * T, w: 12, h: 18, state: 'in', t: 0, mode: mode };
  SFX.dad();

}
function updateDad() {

    dad.x += 3.4;
    dad.y = GROUND * T - dad.h;

          let n = 0;
          foes.forEach((f) => { if (f.alive && f.x > camX - 10 && f.x < camX + W + 10) { killFoe(f, '🏈'); n++; } });
          if (n) setTimeout(() => toast('<b>DAD SPECIAL:</b> Football toss! 🏈 Touchdown!', 1900), 800);
        }
      } else if (dad.mode === 'special') {

function callBro() {

function updateBro() {
  if (!bro) return;
  bro.t++;
  if (bro.state === 'in') {
    if (P.onGround) bro.base = P.y + P.h - 18;

function killFoe(f, txt) {

   PROJECTILES + BLASTS

function updateShots() {

    if (s.kind === 'wave') { s.x += s.vx; s.y = GROUND * T - s.h; s.life--; }
    else { s.vy += s.g; s.x += s.vx; s.y += s.vy; s.life--; }
    if (s.bounce) {
      if (s.y + s.h >= GROUND * T) { s.y = GROUND * T - s.h; s.vy = -s.bounce; }
      const tx = Math.floor((s.x + s.w / 2) / T), ty = Math.floor((s.y + s.h / 2) / T);
      if (solid(tx, ty)) { s.vx = -s.vx; if (s.x < 0) s.life = 0; }
    }
    if (!P.dead && overlap(P, s)) {
      s.gone = true;
      if (P.power === 'popper' || P.rush > 0) {
        SFX.pop(); sparks(s.x + 3, s.y + 3, 6, ['#ff6fae', '#fff']);
      } else if (P.rush <= 0) hurt(s.x);
    }
    if ((s.kind === 'wave' && s.life <= 0) || s.y > GROUND * T + 12 || s.life <= 0) s.gone = true;
    if (s.x < camX - 80 || s.x > camX + W + 80) s.gone = true;
  }
  shots = shots.filter((s) => !s.gone);

  for (const b of blasts) {
    b.x += b.vx; b.life--;
    if (Math.random() < 0.6) part(b.x + 3, b.y + 3, { vx: -b.vx * 0.2, vy: rand(-0.6, 0.6), life: 14, size: 2, color: pick(['#ff6fae', '#f6c445', '#fff']), glow: true, g: 0 });
    if (solid(Math.floor((b.x + 3) / T), Math.floor((b.y + 3) / T))) b.life = 0;
    for (const f of foes) if (b.life > 0 && f.alive && overlap(b, f)) { killFoe(f, 'POP!'); b.life = 0; }
    if (b.life > 0) for (const bs of bosses) {
      if (!bs.out && overlap(b, bs)) { damage(bs, 0.34); sparks(b.x, b.y, 6, ['#ff6fae', '#fff']); b.life = 0; break; }
    }
    if (b.life > 0) for (const s of shots) if (overlap(b, s) && s.kind !== 'wave') { s.gone = true; b.life = 0; }
  }
  blasts = blasts.filter((b) => b.life > 0);

  for (const a of allyShots) {
    a.vy += 0.17; a.x += a.vx; a.y += a.vy; a.life--;
    for (const bs of bosses) if (!bs.out && overlap(a, bs)) { damage(bs, a.dmg, a.why); a.life = 0; break; }

function drawShots() {
  for (const s of shots) {
    const sx = Math.round(s.x - camX), sy = Math.round(s.y);
    if (sx < -30 || sx > W + 30) continue;
    if (s.kind === 'wave') {
      ctx.fillStyle = 'rgba(246,196,69,.85)';
      ctx.beginPath(); ctx.ellipse(sx + 6, sy + 6, 7, 5, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(sx + 6, sy + 5, 3, 2, 0, Math.PI, 0); ctx.fill();
    } else if (s.kind === 'brick') {
      ctx.fillStyle = '#e8364b'; ctx.fillRect(sx, sy + 1, 10, 6);
      ctx.fillStyle = '#ff8a8a'; ctx.fillRect(sx + 2, sy, 3, 2); ctx.fillRect(sx + 6, sy, 3, 2);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(sx, sy + 6, 10, 1);
    } else if (s.kind === 'paint') {
      glowDisc(sx + 4, sy + 4, 9, s.color || '#ff4fa3', 0.6);
      ctx.fillStyle = s.color || '#ff4fa3';
      ctx.beginPath(); ctx.arc(sx + 4, sy + 4, 4, 0, 6.284); ctx.fill();
    } else if (s.kind === 'paper') {
      ctx.fillStyle = '#f4f1e8'; ctx.fillRect(sx, sy, 8, 6);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(sx + 1, sy + 2, 6, 1); ctx.fillRect(sx + 1, sy + 4, 4, 1);
    } else if (s.kind === 'pencil') {
      ctx.fillStyle = '#f6c445'; ctx.fillRect(sx, sy + 2, 8, 3);
      ctx.fillStyle = '#f0e2c8'; ctx.fillRect(sx, sy + 2, 2, 3);
      ctx.fillStyle = '#1b1220'; ctx.fillRect(sx + 8, sy + 3, 2, 1);
    } else if (s.kind === 'ball') {
      ctx.fillStyle = '#f4f1e8'; ctx.beginPath(); ctx.arc(sx + 4, sy + 4, 4.5, 0, 6.284); ctx.fill();
      ctx.fillStyle = '#1b1220'; ctx.fillRect(sx + 3, sy, 1, 8); ctx.fillRect(sx, sy + 3, 8, 1);
    } else if (s.kind === 'heart') {
      ctx.fillStyle = '#ff5d7a';
      ctx.beginPath(); ctx.arc(sx + 2, sy + 2, 2.5, 0, 6.284); ctx.arc(sx + 6, sy + 2, 2.5, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx, sy + 3); ctx.lineTo(sx + 4, sy + 8); ctx.lineTo(sx + 8, sy + 3); ctx.fill();
    } else if (s.kind === 'burger') {
      ctx.font = '11px "Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('🍔', sx + 5, sy + 8);
    } else {
      ctx.font = '10px "Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(s.prop || '🥞', sx + 4, sy + 8);
    }
  }
  for (const a of allyShots) {
    const sx = Math.round(a.x - camX), sy = Math.round(a.y);
    glowDisc(sx + 4, sy + 4, 8, a.color || '#ff4fa3', 0.5);
    ctx.fillStyle = a.color || '#ff4fa3';
    ctx.beginPath(); ctx.arc(sx + 4, sy + 4, 4, 0, 6.284); ctx.fill();
  }
  for (const b of blasts) {
    const sx = Math.round(b.x - camX), sy = Math.round(b.y);
    ctx.fillStyle = ['#ff6fae', '#f6c445', '#fff'][Math.floor(frame / 2) % 3];
    ctx.fillRect(sx, sy, 3, 3); ctx.fillRect(sx + 3, sy + 1, 2, 2);
    glowDisc(sx + 3, sy + 3, 8, 'rgba(255,120,180,.6)', 0.6);
  }
}
function drawParticles() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    const sx = Math.round(p.x - camX), sy = Math.round(p.y);
    ctx.globalAlpha = a;
    if (p.type === 'ring') {
      ctx.strokeStyle = p.color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sx, sy, (1 - a) * 16 + 2, 0, 6.284); ctx.stroke();
    } else {
      if (p.glow) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = p.color;
        ctx.fillRect(sx - 1, sy - 1, p.size + 2, p.size + 2);
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.fillStyle = p.color;
      ctx.fillRect(sx, sy, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const p of pops) {
    const a = clamp(p.t / p.max, 0, 1);
    const sx = Math.round(p.x - camX), sy = Math.round(p.y);
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.font = 'bold 8px "Pixelify Sans",monospace';
    ctx.fillStyle = '#1b1220';
    ctx.fillText(p.txt, sx + 6, sy + 1);
    ctx.fillStyle = p.color || '#f6c445';
    ctx.fillText(p.txt, sx + 5, sy);
    ctx.globalAlpha = 1;
  }
  for (const r of rings) {
    ctx.strokeStyle = r.t % 4 < 2 ? '#f6c445' : '#ff8a3d';
    ctx.lineWidth = 3; ctx.globalAlpha = clamp(r.t / 26, 0, 1);
    ctx.beginPath(); ctx.ellipse(r.x - camX, r.y, r.r, r.r * 0.34, 0, 0, 6.284); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
let vignette = null;
function drawVignette() {

}

    inp.addEventListener('focus', () => { try { inp.select(); } catch (e) { /* ignore */ } });
    inp.addEventListener('change', () => {
      const id = inp.dataset.pet;
      const val = inp.value.trim().slice(0, 12);
      if (val) progress.pets.names[id] = val; else delete progress.pets.names[id];
      save(); SFX.save();
    });
  });
  const pn = $('#playNext');
  if (pn) pn.addEventListener('click', () => {
    AudioSys.init(); SFX.click();
    const next = Math.min(10, Math.max(0, progress.unlocked - 1));
    playStage(next);
  });
  $('#titleBtn').addEventListener('click', () => { SFX.click(); titleScreen(); });
}

async function playStage(i) {
  AudioSys.init();
  showGame(true);
  startStage(i);
  running = true;
  run();
  draw();
  await story(LV[i].intro, 'k');
  paused = false;
  last = 0; acc = 0;
  draw();
}

function confetti() {
  if (reduced) return;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';
  c.setAttribute('aria-hidden', 'true');
  document.body.appendChild(c);
  const x = c.getContext('2d');
  if (!x) { c.remove(); return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const Wc = c.width = Math.floor(innerWidth * dpr), Hc = c.height = Math.floor(innerHeight * dpr);
  const cols = ['#f6c445', '#f4f1e8', '#e8364b', '#6fc8ff', '#5be37a', '#f39ac0', '#ff8a3d'];
  const bits = Array.from({ length: progress.lite ? 70 : 170 }, () => ({
    x: Math.random() * Wc, y: -Math.random() * Hc * 0.9,
    s: (3 + Math.floor(Math.random() * 4)) * dpr,
    v: (1.6 + Math.random() * 3.2) * dpr,
    w: Math.random() * 6.28, spin: (Math.random() - 0.5) * 0.3,
    c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  const f = (t) => {
    x.clearRect(0, 0, Wc, Hc);
    bits.forEach((b) => {
      b.y += b.v; b.w += b.spin;
      const px = Math.round(b.x + Math.sin(t / 300 + b.w) * 14 * dpr), py = Math.round(b.y);
      x.save(); x.translate(px, py); x.rotate(b.w);
      x.fillStyle = b.c; x.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 1.6);
      x.restore();
    });
    if (t - t0 < 7000) requestAnimationFrame(f);
    else c.remove();
  };
  requestAnimationFrame(f);
}

/* ============================================================
   INSTALL + OFFLINE (PWA)
   ============================================================ */
let installPrompt = null;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  $('#sheet').hidden = false;
}
function closeSheet() { $('#sheet').hidden = true; }
function openInstall() {
  AudioSys.init();
  if (installPrompt) {
    installPrompt.prompt();
    installPrompt.userChoice.then((choice) => {
      if (choice && choice.outcome === 'accepted') { installPrompt = null; el.install.hidden = true; }
    }).catch(() => {});
    return;
  }
  const steps = IS_IOS
    ? '<ol><li>Tap the <b>Share</b> button (square with the up arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. It opens full-screen and works offline.</li></ol><p class="tiny">On iPhone and iPad, Safari is the browser that can add it to the home screen.</p>'
    : '<ol><li>Open this page in <b>Safari</b> (iPhone/iPad) or <b>Chrome</b> (Android/tablet).</li><li>Open the browser menu (⋮ or Share).</li><li>Choose <b>Install app</b> or <b>Add to Home Screen</b>.</li></ol><p class="tiny">Once installed it runs full-screen and offline.</p>';
  openSheet(steps);
}
function applyLite() {
  document.body.classList.toggle('lite', !!progress.lite);
  const b = $('#fxBtn');
  if (b) b.textContent = 'Effects: ' + (progress.lite ? 'LITE' : 'FULL');
}
function initPWA() {
  if (location.protocol.indexOf('http') !== 0) return;
  const add = (rel, href) => {
    if (document.querySelector('link[rel="' + rel + '"]')) return;
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  };
  add('manifest', 'manifest.webmanifest');
  add('icon', 'icons/icon-192.png');
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  if (el.install) el.install.hidden = false;
});
window.addEventListener('appinstalled', () => {
  installPrompt = null;
  if (el.install) el.install.hidden = true;
  toast('Installed! Look for <b>Kinan vs Mom</b> on your home screen.', 3000);
});
if (el.install) el.install.addEventListener('click', openInstall);
$('#installBtnP').addEventListener('click', openInstall);
$('#fxBtn').addEventListener('click', () => {
  progress.lite = !progress.lite;
  applyLite(); save(); SFX.click();
});
$('#sheetX').addEventListener('click', closeSheet);
$('#sheetOk').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && AudioSys.ctx && AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
});

   BOOT
   ============================================================ */
function ensureAudio() {
  AudioSys.init();
  if (!running && !Music.name) Music.play('title');
}
window.addEventListener('pointerdown', ensureAudio, { passive: true });
window.addEventListener('keydown', ensureAudio);

bindPad();
AudioSys.on = progress.sound !== false;
applyLite();
initPWA();
if (IS_IOS && !IS_STANDALONE && el.install) el.install.hidden = false;
el.snd.setAttribute('aria-pressed', String(AudioSys.on));
el.snd.textContent = AudioSys.on ? '♪' : '♪̶';

/* test hooks — used by the automated smoke test, harmless otherwise */
window.__k11 = {
  build: build,
  startStage: startStage,
  playStage: playStage,
  state: () => ({
    stage: L && L.i, boss: boss, hp: P && P.hp, max: P && P.max,
    px: P && Math.round(P.x), py: P && Math.round(P.y), camX: Math.round(camX),
    foes: foes.filter((f) => f.alive).length, bosses: bosses.map((b) => b.kind + ':' + b.hp),
    foePos: foes.filter((f) => f.alive).slice(0, 8).map((f) => [Math.round(f.x), Math.round(f.y), f.type]),
    candles: got, totalCandles: totalCandles, score: score, paused: paused, running: running,
    stars: progress.stars, unlocked: progress.unlocked
  }),
  warpBoss: () => { P.x = (L.arenaX + 4) * T; P.y = (GROUND - 1) * T; },
  killBosses: () => { bosses.forEach((b) => { b.inv = 0; if (!b.out) damage(b, b.hp); }); },
  godMode: () => { P.inv = 9e9; },
  addCandles: (n) => { addCandle(n); },
  advance: () => { if (advance) advance(); },
  jumpToStage: (i) => { playStage(i); },
  teleport: (x) => { P.x = x; P.y = (GROUND - 1) * T; camX = Math.max(0, x - W * 0.42); },
  grantPets: () => { progress.pets.ids = PET_DEFS.map((d) => d.id); save(); return progress.pets.ids.slice(); },
  petInfo: () => ({ ids: progress.pets.ids.slice(), names: Object.assign({}, progress.pets.names), liveCats: pets.cats.length, liveDogs: pets.dogs.length }),
  progress: () => JSON.parse(JSON.stringify(progress)),
  defaults: () => JSON.parse(JSON.stringify(DEFAULT_PROGRESS)),
  petSpot: () => (crate ? { x: crate.x, y: crate.y, pet: crate.pet } : null),
  toPet: () => { if (crate) { P.x = crate.x; P.y = crate.y; P.vx = 0; P.vy = 0; } },
  allies: () => allies.length,
  audio: () => (AudioSys.ctx ? AudioSys.ctx.state : 'none')
};

})();
